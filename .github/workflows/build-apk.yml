name: Build & Release Android Debug APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: |
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Setup Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            SDK_DIR="$HOME/android-sdk"
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK_DIR/cmdline-tools"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
            rm -f /tmp/cmdline-tools.zip
          fi

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          for bin_dir in "$SDK_DIR/cmdline-tools/latest/bin" "$SDK_DIR/platform-tools"; do
            if [ -d "$bin_dir" ]; then
              echo "$bin_dir" >> "$GITHUB_PATH"
            fi
          done

          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\ne9acab5b5fbb560a72cfaecce8946896ff6aab9d\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$SDK_DIR/licenses/google-gdk-license"
          printf "\n601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "$SDK_DIR/licenses/android-googletv-license"

          echo "Android SDK ready at: $SDK_DIR"
          ls -la "$SDK_DIR"

      - name: Ensure Android debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and prepare Debug APK artifact
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Debug APK not found at $APK_PATH"
            find android/app/build/outputs/apk -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          mkdir -p release-apk
          cp "$APK_PATH" release-apk/onefd-platform-debug.apk
          # Verify the APK archive itself has zero CRC / data errors
          unzip -tq release-apk/onefd-platform-debug.apk
          ls -lh release-apk/onefd-platform-debug.apk
          sha256sum release-apk/onefd-platform-debug.apk

      - name: Upload Debug APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: onefd-platform-debug-apk
          path: release-apk/onefd-platform-debug.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Publish Debug APK to GitHub Release
        id: publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}-debug', github.run_number) }}"
          RELEASE_TITLE="ONEFD Platform Debug APK (${TAG_NAME})"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-apk/onefd-platform-debug.apk --clobber
          else
            gh release create "$TAG_NAME" release-apk/onefd-platform-debug.apk \
              --target "${{ github.sha }}" \
              --title "$RELEASE_TITLE" \
              --notes "Automatic Android Debug APK build from GitHub Actions (Run #${{ github.run_number }}, Commit ${{ github.sha }})." \
              --latest
          fi
          DIRECT_APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/onefd-platform-debug.apk"
          {
            echo "### تحميل ملف التطبيق مباشرًة (APK)"
            echo ""
            echo "- **رابط التحميل المباشر (بدون فك ضغط ZIP):** [onefd-platform-debug.apk](${DIRECT_APK_URL})"
            echo "- **ملاحظة:** يُفضّل تحميل ملف \`.apk\` مباشرًة من صفحة **Releases** بدلاً من أرشيف \`Artifacts .zip\` لتجنب أخطاء فك الضغط في بعض مديري الملفات على أندرويد."
          } >> "$GITHUB_STEP_SUMMARY"
